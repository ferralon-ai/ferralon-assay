name: 💡 Suggest an improvement
description: A missing feature, a rough edge, or something that could work better.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas from people actually using this are worth a lot to us. Even a
        half-formed one is welcome.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        Tell us about the problem you hit, not just the feature you have in
        mind — often there is a simpler answer we would otherwise miss.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried or considered instead?
      description: Optional — including "nothing, I got stuck" is a useful answer.
