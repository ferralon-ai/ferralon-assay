name: CI

# Green-gates every pull request and every push to main: build, vet, gofmt, and the hermetic
# test suite. Live/network tests are //go:build live gated and never run in the test job, which
# runs with no corpus fixtures and no network access.
#
# The self-scan job runs this checkout's own action.yml (`uses: ./`) against this repository with
# the default scanner-version, so every change exercises the Action end to end: the minor alias
# resolving to its current patch release, the download, the plugin wiring and a real scan. That
# release may lag main; the job tests the Action, not main's unreleased scanner. It runs twice: with
# the Action's defaults (the public advisory corpus) and with builtin-test-advisories-only.

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt (first-party files only)
        run: |
          files=$(gofmt -l $(git ls-files '*.go' | grep -vE '(^|/)(testdata|vendor)/' || true))
          if [[ -n "${files}" ]]; then
            echo "::error::gofmt drift in:"
            echo "${files}"
            exit 1
          fi

      - name: Test
        run: go test ./...

      # The C/C++ lane is its own module (it links the cgx SDK, which the host binary must not):
      # the root ./... does not reach it.
      - name: Build, vet and test plugins/cfamily
        working-directory: plugins/cfamily
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go vet ./...
          go test ./...

  self-scan:
    runs-on: ubuntu-latest
    # Read-only: the surfaces that need write scopes are switched off below, and no secret is used,
    # so the job behaves the same on a fork's pull request.
    permissions:
      contents: read
    # Two legs: the default (the public corpus under its `full` policy, signature-verified) and the
    # built-in-only opt-out. Each asserts the work set its report.json records, so a wiring bug that
    # only a real run reaches (an expression in an `if:` or env line) fails here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: default
            builtin-only: "false"
            work-set-source: builtin_language_set_union_policy
            corpus-policy: full
          - leg: builtin-only
            builtin-only: "true"
            work-set-source: builtin_language_set
            corpus-policy: ""
    name: self-scan (${{ matrix.leg }})
    steps:
      - uses: actions/checkout@v4

      # Findings do not fail this job; only a failed Action or scan does. The scanner exits non-zero
      # on an error, never on a verdict, and the job keeps that contract. It checks that the Action
      # runs, not what advisories say about this repository's dependencies: gating on findings would
      # turn a newly published advisory into a red check on every unrelated pull request. The
      # verdicts land in the job summary and in the ferralon-assay-out directory.
      - name: Run the Ferralon Assay against this repository
        id: assay
        uses: ./
        with:
          mode: baseline
          target: .
          link-to-console: "false"
          issue: "false"
          pr-comment: "false"
          code-scanning: "false"
          builtin-test-advisories-only: ${{ matrix.builtin-only }}

      - name: Check the work set the scan recorded
        env:
          WANT_SOURCE: ${{ matrix.work-set-source }}
          WANT_POLICY: ${{ matrix.corpus-policy }}
          REPORT: ${{ steps.assay.outputs.out-dir }}/report.json
        run: |
          set -euo pipefail
          got_source="$(jq -r '.provenance.intel.work_set_source // ""' "$REPORT")"
          got_policy="$(jq -r '.provenance.intel.corpus_policy // ""' "$REPORT")"
          echo "work_set_source=$got_source corpus_policy=$got_policy"
          if [ "$got_source" != "$WANT_SOURCE" ] || [ "$got_policy" != "$WANT_POLICY" ]; then
            echo "::error::want work_set_source=$WANT_SOURCE corpus_policy=$WANT_POLICY"
            exit 1
          fi
