name: CI

# Green-gates every pull request and every push to main: build, vet, gofmt, and the hermetic
# test suite. Live/network tests are //go:build live gated and never run in the test job, which
# runs with no corpus fixtures and no network access.
#
# The self-scan job runs this checkout's own action.yml (`uses: ./`) against this repository with
# the default scanner-version, so every change exercises the Action end to end: the minor alias
# resolving to its current patch release, the download, the plugin wiring and a real scan. That
# release may lag main; the job tests the Action, not main's unreleased scanner.

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt (first-party files only)
        run: |
          files=$(gofmt -l $(git ls-files '*.go' | grep -vE '(^|/)(testdata|vendor)/' || true))
          if [[ -n "${files}" ]]; then
            echo "::error::gofmt drift in:"
            echo "${files}"
            exit 1
          fi

      - name: Test
        run: go test ./...

  # Does this change touch the C/C++ lane? Pushes to main always say yes, so a break stays visible
  # there; a pull request says yes only when it touches plugins/cfamily (the pin files and the cgx
  # entries of its go.mod/go.sum live there) or this workflow.
  cfamily-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${EVENT}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -qE '^(plugins/cfamily/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The C/C++ lane is its own module (it links the cgx SDK, which the host binary must not): the
  # root ./... does not reach it, so it has its own job.
  #
  # Tracker #792: this job is EXPECTED to be red until the cgx SDK pin is repinned. The pinned
  # commit (plugins/cfamily/cfamilycgx/engine_pin.go) was orphaned by a force-push, so a cold
  # module cache cannot fetch it. The job is kept out of `test` so Go-only changes are not blocked.
  cfamily:
    name: cfamily (cgx pin, tracker #792)
    needs: cfamily-changes
    if: needs.cfamily-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build, vet and test plugins/cfamily
        working-directory: plugins/cfamily
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go vet ./...
          go test ./...

  self-scan:
    runs-on: ubuntu-latest
    # Read-only: the surfaces that need write scopes are switched off below, and no secret is used,
    # so the job behaves the same on a fork's pull request.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Findings do not fail this job; only a failed Action or scan does. The scanner exits non-zero
      # on an error, never on a verdict, and the job keeps that contract. It checks that the Action
      # runs, not what advisories say about this repository's dependencies: gating on findings would
      # turn a newly published advisory into a red check on every unrelated pull request. The
      # verdicts land in the job summary and in the ferralon-assay-out directory. The house canaries
      # give the scan work without an advisory corpus.
      - name: Run the Ferralon Assay against this repository
        uses: ./
        with:
          mode: baseline
          target: .
          include-house-canaries: "true"
          link-to-console: "false"
          issue: "false"
          pr-comment: "false"
          code-scanning: "false"
