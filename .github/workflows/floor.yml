name: Floor run

# The floor is a diagnostic test suite: every fixture under cmd/floorcheck/fixtures/ pins a repository at a full
# commit, its toolchain, and the advisories it is scanned against (the ones adjudicated for it, each
# pinned by sha256 in the fixture's intel/). `floorcheck run` scans each fixture with the scanner built
# from this commit and judges the report against the fixture's expect.yaml. Exit 1 means an adjudicated
# finding regressed; exit 2 means a fixture could not be judged (a pin did not verify, the checkout or
# scan failed, the scan was cut short). The run never changes an expectation: those change by hand, in
# the PR that moves them.
#
# It runs every fixture nightly on main. Run it by hand (Actions → Floor run → Run workflow), naming
# fixtures or leaving the selector empty for all of them. Locally:
# `go run ./cmd/floorcheck run <fixture…> --out DIR --scanner <ferralon-assay>`.

on:
  schedule:
    - cron: "43 8 * * *" # nightly, off the hour (08:43 UTC)
  workflow_dispatch:
    inputs:
      fixtures:
        description: "Fixture directory names under cmd/floorcheck/fixtures/, space-separated. Empty runs every fixture."
        required: false
        default: ""
      scan-timeout:
        description: "Per-fixture scan budget in whole minutes, 1m to 60m (the fixture job allows 90)."
        required: false
        default: "40m"

permissions:
  contents: read

jobs:
  plan:
    name: Build and plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Built once from this commit and shared with every fixture job. The analyzers carry the lookup
      # names the scanner resolves on PATH (assay-plugin-<lang>); the version names the commit.
      - name: Build the scanner, its analyzers and floorcheck
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/floor-bin"
          mkdir -p "$bin"
          ld="-s -w -X github.com/ferralon-ai/ferralon-assay/internal/brand.Version=main-${GITHUB_SHA::12}"
          export CGO_ENABLED=0
          go build -trimpath -ldflags "$ld" -o "$bin/ferralon-assay" ./cmd/ferralon-assay
          for lang in go python js java dotnet kotlin; do
            go build -trimpath -ldflags "$ld" -o "$bin/assay-plugin-$lang" "./cmd/assay-plugin-$lang"
          done
          go build -trimpath -o "$bin/floorcheck" ./cmd/floorcheck

      # Every selected fixture's pins are verified before any runner is spent on it. The matrix carries
      # each fixture's lane and runtime pins so the scan job installs exactly those runtimes.
      - name: Verify the fixtures and plan the matrix
        id: plan
        env:
          SELECTED: ${{ inputs.fixtures }}
          SCAN_TIMEOUT: ${{ inputs.scan-timeout || '40m' }}
        run: |
          set -euo pipefail
          # The scan budget must end inside the fixture job's timeout, or a slow scan is killed with
          # its observation unwritten.
          if ! [[ "$SCAN_TIMEOUT" =~ ^([1-9][0-9]?)m$ ]] || (( BASH_REMATCH[1] < 1 || BASH_REMATCH[1] > 60 )); then
            echo "::error::scan-timeout $SCAN_TIMEOUT: give whole minutes from 1m to 60m."
            exit 1
          fi
          fc="$RUNNER_TEMP/floor-bin/floorcheck"
          read -r -a names <<< "$SELECTED"
          "$fc" validate --fixtures-root cmd/floorcheck/fixtures "${names[@]}"
          all="$("$fc" list --fixtures-root cmd/floorcheck/fixtures)"
          if [ "${#names[@]}" -eq 0 ]; then
            matrix="$all"
          else
            matrix="$(jq -c --args '[.[] | select(.name as $n | $ARGS.positional | index($n))]' "${names[@]}" <<< "$all")"
          fi
          if [ "$(jq length <<< "$matrix")" -eq 0 ]; then
            echo "::error::No fixture selected."
            exit 1
          fi
          echo "matrix=$(jq -c '{include: .}' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          jq -r '"Fixtures: \(length)"' <<< "$matrix"

      - uses: actions/upload-artifact@v4
        with:
          name: floor-bin
          path: ${{ runner.temp }}/floor-bin
          retention-days: 3
          if-no-files-found: error

  fixture:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # The fixtures and their advisories; nothing else is needed.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cmd/floorcheck/fixtures
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: floor-bin
          path: ${{ runner.temp }}/floor-bin

      # The system packages the fixture pins (C headers its cgo build reads). floorcheck validated each
      # name as a Debian package name, so the unquoted expansion only splits the list.
      - name: Install system packages
        if: matrix.apt != ''
        env:
          APT_PACKAGES: ${{ matrix.apt }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # shellcheck disable=SC2086
          sudo apt-get install -y -q --no-install-recommends $APT_PACKAGES

      # The runtimes the fixture pins. The harness also sets GOTOOLCHAIN to the pinned Go release, so a
      # mismatched local toolchain would be replaced rather than used.
      - uses: actions/setup-go@v5
        if: matrix.go != ''
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-java@v4
        if: matrix.jdk != ''
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: actions/setup-node@v4
        if: matrix.node != ''
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        if: matrix.python != ''
        with:
          python-version: ${{ matrix.python }}

      - name: Run the fixture
        id: run
        env:
          FIXTURE: ${{ matrix.name }}
          SCAN_TIMEOUT: ${{ inputs.scan-timeout || '40m' }}
        run: |
          set -uo pipefail
          bin="$RUNNER_TEMP/floor-bin"
          chmod +x "$bin"/*
          rc=0
          "$bin/floorcheck" run "$FIXTURE" --out "$RUNNER_TEMP/floor-obs" --fixtures-root cmd/floorcheck/fixtures \
            --scanner "$bin/ferralon-assay" --work "$RUNNER_TEMP/floor-work" --scan-timeout "$SCAN_TIMEOUT" || rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/floor-obs/summary.md" ]; then
            cat "$RUNNER_TEMP/floor-obs/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      # The disk this fixture needed (checkout, module and build caches), for sizing the runners. Its
      # own step, so a run that failed or hit the job timeout still records it.
      - name: Record the disk footprint
        if: always()
        env:
          FIXTURE: ${{ matrix.name }}
          RUN_EXIT: ${{ steps.run.outputs.exit }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/floor-obs"
          {
            echo "fixture=$FIXTURE"
            echo "exit=${RUN_EXIT:-none}"
            echo "work_kb=$(du -sk "$RUNNER_TEMP/floor-work" 2>/dev/null | cut -f1)"
            echo "home_kb=$(du -sk "$HOME" 2>/dev/null | cut -f1)"
            df -k --output=used,avail / | tail -n 1 | awk '{print "root_used_kb=" $1 "\nroot_avail_kb=" $2}'
          } > "$RUNNER_TEMP/floor-obs/footprint.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-obs-${{ matrix.name }}
          path: ${{ runner.temp }}/floor-obs
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: Floor summary
    needs: [plan, fixture]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: floor-obs-*
          path: floor-observations

      # One table over every fixture's summary.json, read file by file so one unreadable summary costs
      # only its own fixture. A fixture with no readable summary (its job was cancelled or timed out, or
      # the file is damaged) counts as incomplete, never as passed.
      - name: Summarize
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          : > fixtures.jsonl
          for f in floor-observations/*/summary.json; do
            if jq -c '.fixtures[]' "$f" > one.jsonl; then
              cat one.jsonl >> fixtures.jsonl
            else
              echo "::warning::$f is not a readable summary; its fixture counts as incomplete."
            fi
          done
          jq -s '.' fixtures.jsonl > all.json
          jq -r '.include[].name' <<< "$MATRIX" | sort > planned.txt
          jq -r '.[].fixture' all.json | sort > judged.txt
          missing="$(comm -23 planned.txt judged.txt)"
          {
            echo "## Floor run"
            echo
            echo "| Fixture | Outcome | Regressed | Met | Improved | Incomplete | Unexpected | Drift |"
            echo "|---|---|---|---|---|---|---|---|"
            jq -r 'sort_by(.fixture)[] | "| \(.fixture) | \(.outcome) | \(.counts.regressed) | \(.counts.met) | \(.counts.improved) | \(.counts.incomplete) | \(.unexpected) | \(.drift) |"' all.json
            for m in $missing; do echo "| $m | no observation | | | | | | |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          if jq -e 'any(.[]; .outcome == "regressed")' all.json > /dev/null; then
            echo "::error::A fixture regressed."
            exit 1
          fi
          if [ -n "$missing" ] || jq -e 'any(.[]; .outcome != "pass")' all.json > /dev/null; then
            echo "::warning::Some fixtures could not be judged; they are incomplete, not passed."
            exit 2
          fi
