# Ferralon Assay — the composite GitHub Action.
#
# Runs the free, deterministic Ferralon Assay scan against the calling repository. For each advisory
# in scope it resolves the subject's dependency versions, maps the advisory onto vulnerable symbols,
# builds a call graph, and reports whether that code is reachable from a framework entry point. The
# scan runs entirely in your runner: it never executes code from the scanned repository and never
# runs a model.
#
# WHAT IT NEEDS
#   - The repository already checked out (run actions/checkout before this action).
#   - Network access to GitHub releases, to fetch the pinned scanner artifact.
#   - A write token only if you want the SARIF, PR-comment or Issue surfaces; the job summary is
#     written regardless.
#
# WHAT IT PRODUCES
#   Into the `out` directory: report.json (the neutral scan Report), report.html,
#   report.sarif.json (SARIF 2.1.0) and openvex.json (OpenVEX). The `out-dir` and `sarif-file`
#   outputs carry the resolved paths. Each Report records the analyzer identity that produced it —
#   the tool name plus the version of the scanner release that ran.
#
# READING THE VERDICTS — this matters most on a repository whose analyzer is shallower than Go's.
# The Report has five verdicts, and `undetermined` is the one to look for: an `undetermined` finding
# carries an `undetermined_reason`. An undetermined row is an open question, never a clean bill —
# treat it as unassessed. `not_exploitable` and `disqualified` each carry the basis they stand on.
# OpenVEX mirrors the split: `under_investigation` for the open rows (`undetermined` and
# `reachable_candidate`), `not_affected` for the two that adjudicated, and `affected` for
# `malicious_package_present`.
#
# How deep the analysis goes for YOUR ecosystem is a property of the release you pin, not of this
# file — the per-finding verdicts and the scan-level limits in the Report you get are the answer.
#
# A scan whose work set resolves to zero advisories FAILS the run rather than publishing a
# findings-free Report a reader cannot tell apart from an assessed all-clear (see `scanWorkSet` in
# cmd/ferralon-assay/run.go). That is a deliberate refusal to imply coverage that was not performed.
#
# NO COMMITTED BINARY. This action fetches a versioned scanner release at run time and builds
# nothing. Nothing is committed into your repository; the footprint is a few lines of reviewable
# YAML pinned to a scanner release by version tag.
#
# WHICH SCANNER RUNS. On `main` the `scanner-version` default is a minor alias (vX.Y), which the
# fetch step resolves at run time to that minor's current patch release
# (scripts/resolve-scanner-version.sh).
# Every release tag of this Action is a minted leaf whose default names the exact vX.Y.Z it was cut
# as, so `uses: ferralon-ai/ferralon-assay@vX.Y.Z` (or that tag's commit SHA) always fetches the same
# scanner release, and `@vX.Y` fetches the patch that alias's leaf was cut as. Only `@main` floats.
#
# OPTIONAL CHECKSUM PIN (off by default). The run is selected by version tag alone: `scanner-version`
# names the release, and that release's linux/amd64 tarball is fetched and run. A consumer who wants
# to freeze the exact bytes can set `scanner-sha256` themselves — when it is non-empty the fetched
# tarball's sha256 is verified against it BEFORE the scanner is unpacked, and a mismatch aborts the
# run. A checksum names one exact release, so it requires an exact vX.Y.Z `scanner-version`; paired
# with a vX.Y alias the run fails before fetching anything. Empty (the default) skips that check.
# This is a customer-configured supply-chain control, not a Ferralon-shipped one: a checksum THIS
# repository pinned against its OWN release asset would be
# verifying our bytes against our own claim about them — it defends against nothing the version tag
# does not — so we do not ship a default. Every release publishes its tarball sha256 as a `.sha256`
# companion asset, for anyone who chooses to pin.
#
# ADVISORY CORPUS (optional, OFF by default). With `advisory-corpus-repo` set, the run fetches a
# PUBLIC advisory corpus — unauthenticated, shallow, sparse — before the scan and points the scanner
# at it; `advisory-corpus` instead takes a directory the workflow checked out itself. Both are empty
# by default, in which case the scan resolves advisory facts from the scanner's built-in table.
# Setting either DECLARES the run requires a corpus, and that declaration is computed from these
# inputs alone rather than from whether the fetch step succeeded — so a broken fetch fails the run
# instead of silently degrading to built-in intel. Both inputs require a scanner release carrying
# the `-advisory-corpus` flag; see the note on `advisory-corpus-repo` below. On its own a corpus
# supplies advisory FACTS; it does not change which advisories the scan evaluates.
#
# With `advisory-corpus-policy` also set, the policy defines the scan's work set: the built-in floor
# plus every advisory in the policy whose affected package is one of the repository's own
# dependencies. The repo fetch downloads that policy's prebuilt bundle
# (`<policy>.jsonl.gz`) from a `corpus-*` release instead of git-fetching the record tree, and
# verifies it before the scan. First the release's bundles.json is verified with cosign (v3.1.3,
# fetched by scripts/install-cosign.sh and checked against a pinned sha256) against its
# bundles.json.sigstore.json, for the exact `corpus-signer-identity` and `corpus-signer-issuer` the
# caller supplies; then the bundle's sha256 against that bundles.json, and its member set against the
# policy manifest read from the git commit the release tag points at. Any failure fails the run, and
# a release is never used unverified. The scanner records the verified signer on the Report.
# The same release supplies the EPSS/KEV signals the scanner ranks findings with: its
# signals.json.gz, downloaded only after the signature check and pinned to the sha256 the signed
# bundles.json names (bundle_version 1.1.0 or later), is passed to the scanner as -advisory-signals.
# A release that cannot supply verified signals (an older bundle_version, no `signals` object, no
# asset, a mismatch) fails the run. VERSION REQUIREMENT: a scanner release carrying the
# `-advisory-signals` flag, which the scan step passes whenever a release is read; see the note on
# `advisory-corpus-policy` below. Verified is not fresh: a stale signals file still loads, with a
# warning in the scan log. A corpus directory handed to `advisory-corpus` is ranked with its own root
# signals.json, when it has one. The git fetch fetches no signals, so a run on that route alone (no
# `advisory-corpus-policy`) ranks nothing.
# TRUST LIMIT: the signature proves bundles.json came from the identity the CALLER names, as
# certified by the Sigstore public-good trust root; both are trusted, not verified, here. Assay
# names no signer of its own. A ref that names no release, and a policy the release publishes no
# bundle for, take the git fetch, which is not signature-checked. See
# scripts/fetch-corpus-bundle.sh for the full chain. Reading a bundle needs a scanner release whose
# -advisory-corpus accepts a bundle file.
#
# SURFACE TOGGLES. The `issue` / `pr-comment` / `code-scanning` inputs are mapped onto the
# scanner's own ASSAY_* env vars inside this action, so a caller's workflow never writes them.
# Any env name spelled literally here must track brand.EnvPrefix (internal/brand) — see the note
# at the run step.
#
# SELF-CLEANUP. The pinned scanner release carries Ferralon's revoke-signing PUBLIC key and the
# ingest + run-snapshot endpoints, baked in at build time — so a caller opts in with a boolean and
# never writes a Ferralon hostname into their own repository. When `link-to-console` is true, the
# scan beacons ingest after each run; a signed HTTP-410 install-revoke (the backing App was
# uninstalled) confirmed on N=2 consecutive runs makes the scan remove its own footprint — it
# deletes the workflow file (direct push, else a removal PR), then deletes `refs/assay/state`, the
# default state ref (statestore.DefaultRef — note that it deletes THAT ref, not a `state-ref` you
# set) — degrading to self-disable plus a one-manual-step Issue only if git/API writes are
# refused. Only a
# cryptographically-signed, key-id-matched revoke bound to THIS repo actuates; transient outages
# never do.

name: Ferralon Assay
# QUOTED, and it must stay quoted: the value contains ": ", which a plain YAML scalar may not carry.
# GitHub's parser accepts it unquoted; a spec-conforming one rejects the whole file, so a consumer
# running any ordinary YAML tooling over their workflow dependencies would choke on this Action.
description: 'Free, deterministic reachability scan — fetches a versioned scanner release at run time (no committed binary). An advisory the analysis could not resolve is reported undetermined, never as a clean bill.'
author: ferralon-ai

# Marketplace listing metadata. GitHub accepts exactly two keys here, `icon` and `color`, and
# rejects the LISTING (not the parse) on any value outside its accepted sets — so a wrong value
# looks fine in every local check and fails only at submission time. `share-2` is the node-link
# graph glyph: this scanner's answer comes from a call graph, not from a version comparison.
# `blue` reads analytic rather than alerting, which is the right register for a report whose
# most common row is an open question.
branding:
  icon: share-2
  color: blue

inputs:
  # --- the version selector ----------------------------------------------------------------------
  # `scanner-version` below names the release this action fetches. On main the default is a minor
  # alias (vX.Y); release.yml stamps it to the exact vX.Y.Z on each release's minted leaf and
  # refuses to cut from a commit whose default is not a vX.Y alias. Before relying on the default,
  # independently confirm the release it selects exists and carries what you need:
  #   gh release view <the scanner-version default below> --repo ferralon-ai/ferralon-assay
  # (for an alias, the run log's "resolved to vX.Y.Z" line names the release). No version is named
  # in this prose on purpose — the `default:` line IS the selector; re-verify against it, not against
  # a version copied into prose that would silently drift.
  # The same rule covers CAPABILITY claims: nothing in this file may state what the selected release
  # does or does not carry, or the claim goes false at the first cut that changes the answer, with
  # nothing to correct it. State a version requirement as a REQUIREMENT the reader checks against the
  # release, never as a fact about it.
  scanner-version:
    description: >-
      Scanner release to fetch from scanner-repo: an exact release tag (vX.Y.Z), or a minor alias
      (vX.Y) that resolves at run time to the release the repository's vX.Y tag points at, which is
      that minor's newest patch. Alias resolution is an anonymous `git ls-remote`, so an alias needs
      a publicly readable scanner-repo; for a private one, set an exact vX.Y.Z. The run log names the
      release an alias resolved to.
    required: false
    default: "v0.5"
  scanner-sha256:
    description: >-
      OPTIONAL opt-in integrity pin. Empty (default) = fetch by version tag only, no checksum check.
      Set it to the sha256 of ferralon-assay-scanner_<scanner-version>_linux_amd64.tar.gz (published
      as the release's `.sha256` asset) to freeze the exact bytes: the run then verifies the fetched
      tarball against it and fails loud on any mismatch. Requires an exact vX.Y.Z scanner-version; a
      checksum paired with a vX.Y alias fails the run.
    required: false
    default: ""
  scanner-repo:
    description: "owner/repo hosting the pinned scanner release assets."
    required: false
    default: "ferralon-ai/ferralon-assay"
  scanner-token:
    description: "Token used to download the release asset (default: the job's github.token; sufficient for a public scanner-repo)."
    required: false
    default: ""

  # --- scan surface (mapped onto the fetched build's brand.EnvPrefix, ASSAY_*) ------------------
  mode:
    description: "Run mode: baseline | pr-inherit | cve-watch."
    required: false
    default: baseline
  target:
    description: "Repository root to scan, relative to the workspace. The language is detected from its contents."
    required: false
    default: .
  subject-toolchain-reachability:
    description: >-
      Opt-in (default OFF). Set to 'true' to let a scan that genuinely ran under the subject's own
      toolchain report a reachability verdict for a stdlib advisory it could adjudicate, instead of
      withholding it as undetermined. OFF withholds a stdlib advisory whose search found no path as
      undetermined, because that absence describes the scanner's own toolchain, not yours.
    required: false
    default: "false"
  library-entrypoints:
    description: >-
      Which of your packages code outside this build may import, and so call past your build's own
      entry points. 'auto' infers them (today Go only; a package under cmd/, examples/ or a test
      directory is not one), 'none' says the build ships programs only, and a list of paths relative
      to the repository root nominates them, e.g. "pkg/api, !pkg/api/internal"; a '!path' entry takes a path
      out, and a list of '!path' entries alone keeps 'auto' for the rest. A not_exploitable verdict
      that holds only because of what you declared carries that on the report as an assumption.
    required: false
    default: auto
  out:
    description: "Output directory for report.json / report.html / report.sarif.json / openvex.json."
    required: false
    default: ferralon-assay-out
  subject-repo:
    description: "Neutral repository identity recorded on the Report."
    required: false
    default: ${{ github.repository }}
  revision:
    description: "Revision recorded on the Report (e.g. a branch or PR head). When .github/ferralon.yml sets analyze.ref, the Report records that ref instead, because that is what was analyzed."
    required: false
    default: ${{ github.ref_name }}
  commit:
    description: "Resolved commit SHA recorded on the Report. When .github/ferralon.yml sets analyze.ref, the Report records the analyzed commit instead."
    required: false
    default: ${{ github.sha }}
  state-repo:
    description: "GitHub Refs-API StateStore as owner/repo (passed as -repo). Persists the baseline on the default branch."
    required: false
    default: ""
  state-ref:
    description: "State ref to read/write (passed as -ref). The consumer sets this to its cross-team-contract ref."
    required: false
    default: ""
  state-token:
    description: "GitHub token for the Refs-API StateStore (passed as -token; default: the job's github.token)."
    required: false
    default: ""
  plugin-go:
    description: "Optional explicit path to a prebuilt analyzer plugin binary, applied to the detected language (override). Default: the per-language plugins unpacked from the fetched release are resolved automatically via PATH."
    required: false
    default: ""
  include-house-canaries:
    description: >-
      Set to 'true' to include the first-party house-canary advisories (the FERRALON-APP-* Go
      application-sink findings and the synthetic Java, Kotlin, JS, Python and .NET corpus
      advisories) in the scan corpus, forwarding -include-house-canaries to the scanner. OFF by
      default so a normal scan never evaluates them; the Ferralon demo scan sets it so the
      app-level DOS canary surfaces as a reachable_candidate the pipeline can enumerate and fire.
      It is not a coverage control: the canaries are synthetic first-party advisories over
      synthetic packages, so turning them on to get a scan to complete would report findings
      against packages the subject does not depend on. VERSION REQUIREMENT: a scanner release
      carrying the -include-house-canaries flag. A
      release that lacks it fails the scan loudly ("flag provided but not defined:
      -include-house-canaries") rather than ignoring the input; if that is what you get, raise
      scanner-version to a release that carries it.
    required: false
    default: "false"
  dependency-code:
    description: >-
      Whether a JavaScript scan reads its npm dependencies' code, forwarded to the scanner as
      ASSAY_DEPENDENCY_CODE. 'fetch' downloads each locked package from the registry the
      repository's .npmrc names and reads it only once its bytes match the lockfile's integrity
      hash; 'offline' reads only a cache already on the runner; 'off' reads none. Empty (default)
      leaves the choice to the scanner release's own default. Fetched packages land under the
      runner's temp directory, which is emptied after the job; persist-dependency-cache decides
      which of them persist between runs. If the fetch fails, the scan reports what it would with 'off' and names
      the cause on the Report. The scanned branch's .npmrc chooses which registry host receives
      NODE_AUTH_TOKEN/NPM_TOKEN, as with npm ci; don't export them on pull-request jobs, or set
      'off'. VERSION REQUIREMENT: a scanner release that reads ASSAY_DEPENDENCY_CODE; one that predates it ignores the variable.
    required: false
    default: ""
  persist-dependency-cache:
    description: >-
      Which fetched npm packages persist between runs in the GitHub Actions cache, keyed on the
      repository's lockfiles. 'auto' (default): on a private or internal repository, every
      package; on a public repository, or when the event payload carries no repository
      (schedule), every package except those from a registry the .npmrc holds an auth entry for,
      which are fetched again on every run and never written to the cached directory. 'always'
      persists every package on any repository; any workflow run allowed to restore the cache can
      read it, and on a public repository that includes pull-request workflows from forks, which
      can restore default-branch caches, so 'always' on a public repository exposes private
      packages to them. 'never' persists nothing, and each run fetches every package again.
      VERSION REQUIREMENT for 'auto' on a public repository: a scanner release that reads
      ASSAY_DEPENDENCY_UNCREDENTIALED_CACHE; one that predates it persists nothing.
    required: false
    default: "auto"
  scan-timeout:
    description: >-
      How long the scan may run, as a duration such as 30m, forwarded to the scanner as
      ASSAY_SCAN_TIMEOUT. Analysis stops early enough to publish the report (the last tenth of the
      limit, at most 2m), and every advisory it did not reach is reported as not assessed, never as
      safe. Set it below the job's timeout-minutes so the scan ends itself before the runner does.
      Empty (default) sets no limit. Either way, a job timeout or cancellation stops analysis and
      gives the scan a few seconds to publish what it assessed; the scan-truncated output says
      whether it was cut short. VERSION REQUIREMENT: a scanner release that reads
      ASSAY_SCAN_TIMEOUT; one that predates it ignores the variable.
    required: false
    default: ""
  issue:
    description: "Set to 'false' to disable the scanner's own pinned-Issue surface. Default enabled."
    required: false
    default: "true"
  pr-comment:
    description: "Set to 'false' to disable the scanner's own sticky PR-comment surface. Default enabled."
    required: false
    default: "true"
  code-scanning:
    description: "Set to 'false' to disable the scanner's own SARIF code-scanning surface. Default enabled."
    required: false
    default: "true"
  # --- advisory corpus (optional; default OFF = the built-in advisory table) --------------------
  # Two ways to supply one, and a REQUIREMENT that is declared from configuration alone. Both carry
  # the same version requirement — a scanner release that carries the -advisory-corpus flag. Read
  # the note on advisory-corpus-repo before wiring either.
  advisory-corpus:
    description: >-
      Path to an ALREADY-checked-out advisory corpus (a directory holding manifest.json plus the
      digest-pinned per-advisory JSON records it indexes), forwarded to the scanner as
      -advisory-corpus. Use this when the workflow materializes the corpus itself; it takes
      precedence over advisory-corpus-repo, whose fetch step is then skipped entirely. The corpus
      supplies advisory facts; it does not change which advisories the scan evaluates. Findings are
      ranked by EPSS/KEV from the signals.json at the directory's root when it has one (and carry
      no priority when it has none); nothing is fetched or verified for it. Empty (default) = no
      corpus, and the scan resolves advisory facts from the built-in table.
    required: false
    default: ""
  advisory-corpus-repo:
    description: >-
      owner/repo of a PUBLIC advisory-corpus repository to fetch before the scan. The fetch is
      UNAUTHENTICATED by construction — it presents no token, so the repository must be readable
      anonymously — and is shallow (--depth 1) and sparse (the manifest and the record partitions
      only). Empty (default) = no fetch. Setting this OR advisory-corpus DECLARES that this run
      requires a corpus, which is forwarded to the scanner out of band
      (ASSAY_ADVISORY_CORPUS_REQUIRED) so that a corpus which is missing or carries zero records
      FAILS the run rather than quietly falling back to the built-in table. VERSION REQUIREMENT: a
      scanner release carrying the -advisory-corpus flag — confirm the release named by the
      scanner-version default carries it before you opt in. A release that lacks it fails the scan
      loudly ("flag provided but not defined: -advisory-corpus") rather than ignoring either corpus
      input; if that is what you get, raise scanner-version to a release that
      carries it. On this git route without advisory-corpus-policy, no EPSS/KEV signals are
      fetched, so findings carry no EPSS/KEV priority; to get priority, set advisory-corpus-policy
      (the release route), which reads the verified signals of the corpus release the ref names.
    required: false
    default: ""
  advisory-corpus-ref:
    description: >-
      Branch, tag, or commit SHA of advisory-corpus-repo to fetch (all three resolve the same way).
      A commit SHA is the reproducible choice. Independently of this ref, the scanner records the
      corpus's own corpus_digest on the Report, which is what identifies the exact corpus state a
      run read. With advisory-corpus-policy set, a corpus release tag (corpus-<12 hex>) is the
      reproducible choice, and the default main (or latest) resolves to the most recent corpus
      release rather than the branch head; a branch or commit SHA names no release, so it takes the
      git fetch.
    required: false
    default: main
  advisory-corpus-policy:
    description: >-
      Policy of advisory-corpus-repo that defines what the scan evaluates (e.g. published-7d,
      full), in place of the whole corpus. Every advisory in the policy whose affected package is
      one of this repository's own dependencies joins the scan's work set, alongside the scanner's
      built-in floor; an advisory that names no affected package cannot be matched; it is disclosed
      as an analysis limit (count and ids) without qualifying the report headline. When the corpus release named by advisory-corpus-ref publishes a bundle for the
      policy, the run downloads that one file instead of git-fetching the record tree, and verifies
      it first (sha256 against the release's bundles.json; members against the policy manifest at
      the release's git tag), after verifying the release's signature with cosign against
      corpus-signer-identity and corpus-signer-issuer, which this route then requires. A bundle that
      fails any check FAILS the run. Whenever a release is read, its EPSS/KEV signals come from it
      too, verified: the release's signals.json.gz must match the sha256 its signed bundles.json
      names, and is passed to the scanner as -advisory-signals. A release that cannot supply them
      (bundles.json older than bundle_version 1.1.0, no signals object, no asset, or a mismatch)
      FAILS the run. Verified is not fresh: the check proves the file is the one the signed release
      names, not that its values are recent, so a stale signals file still loads, with a warning in
      the scan log. VERSION REQUIREMENT: a scanner release carrying the -advisory-signals flag —
      confirm the release named by the scanner-version default carries it before you set this
      input. A release that lacks it fails the scan loudly ("flag provided but not defined:
      -advisory-signals") rather than ranking without the verified signals; if that is what you
      get, raise scanner-version to a release that carries it. A policy the release
      publishes no bundle for is read from the git fetch, using the policy's manifest. Empty
      (default) = the whole corpus via the git fetch, exactly as without this input. Ignored when
      advisory-corpus is set. Bundles need a scanner release whose -advisory-corpus accepts a
      bundle file.
    required: false
    default: ""
  corpus-signer-identity:
    description: >-
      Certificate identity that must have signed the corpus release (the exact value cosign's
      --certificate-identity matches; no pattern). REQUIRED when advisory-corpus-policy is set and
      advisory-corpus-ref names a corpus release, which the default main does: the bundle route
      verifies the release's bundles.json against bundles.json.sigstore.json with cosign before it
      trusts anything in it, and fails the run when this is empty, the signature is missing, or it
      does not verify. There is no default: Assay does not choose whose signature you trust. Take the
      value from the corpus's own consumer documentation. Verification needs the runner to reach
      github.com (the pinned cosign release) and the Sigstore TUF CDN (tuf-repo-cdn.sigstore.dev),
      which serves the Sigstore trust root.
    required: false
    default: ""
  corpus-signer-issuer:
    description: >-
      OIDC issuer of corpus-signer-identity (cosign's --certificate-oidc-issuer, matched exactly).
      Required on the same bundle route as corpus-signer-identity; no default.
    required: false
    default: ""
  link-to-console:
    description: >-
      Link this run to your Ferralon console. The ONLY switch that decides whether the scan talks
      to Ferralon at all: 'true' lets it post its scan results and a self-cleanup revoke beacon to
      the endpoints baked into the pinned scanner release; anything else (including the 'false'
      default) runs the scan fully standalone — nothing reaches Ferralon. Your code and your
      credentials never leave the runner. The scan fetches dependencies and the Go vulnerability
      database, the same as 'go build' and 'govulncheck' do. Which endpoints a linked run uses is a
      property of the release you pinned, not something the workflow configures, so no Ferralon
      hostname is written into your repository. Deleting this line DISABLES the link; it never
      silently re-enables it.
    required: false
    default: "false"
  self-cleanup-on-revoke:
    description: >-
      When a linked run (link-to-console: true) confirms a cryptographically-signed install-revoke on
      N=2 consecutive runs, the scanner removes its own footprint (the workflow file and the default
      state ref). Set this to 'false' to keep the console link on but HOLD that removal: the revoke is
      still beaconed, counted and reported, but nothing is deleted. Default 'true' — installing the
      Action and accepting its PR is the opt-in, and the operator turns the removal off here. VERSION
      REQUIREMENT: honored by scanner releases carrying the FERRALON_SELF_CLEANUP_ON_REVOKE gate;
      older releases ignore it and self-cleanup stays on.
    required: false
    default: "true"
  ingest-url:
    description: >-
      OVERRIDE for the ingest endpoint a linked run beacons (GHE / substrate / dev). Empty (default)
      = use the endpoint baked into the pinned scanner release. This does NOT enable anything on its
      own — with link-to-console unset or false the scan never beacons, whatever is set here.
      When a linked run does beacon, a cryptographically-signed HTTP-410 install-revoke returned for
      N=2 consecutive runs (i.e. the backing Ferralon App was uninstalled) makes the scan remove its
      own footprint (workflow file + state ref). The revoke public key is baked into the pinned
      release at build time, so only a genuine, signed revoke can ever actuate — a transient
      outage never does.
    required: false
    default: ""
  runs-url:
    description: >-
      OVERRIDE for the run-snapshot endpoint a linked run pushes to (GHE / substrate / dev). Empty
      (default) = use the endpoint baked into the pinned scanner release; like ingest-url it enables
      nothing on its own. When a linked scan has assessed this repository's CANONICAL REF it pushes
      its own tegron.report.v3 verdict layer there at run time, under the workflow's GitHub-Actions
      OIDC token (audience ferralon-ingest, id-token: write) — the push the console fleet view
      renders a live assessment from. The canonical ref is the one .github/ferralon.yml `analyze.ref`
      designates, and, absent that file, your repository's default branch — so a repository that sets
      no analyze.ref pushes on exactly the default-branch runs it always did. Any run that assessed
      some OTHER ref — a PR, a feature branch, a tag — stays stateless and NEVER files a run. The push
      is FAIL-OPEN: a rejected or unreachable endpoint only warns, it never fails the scan job.
    required: false
    default: ""

outputs:
  out-dir:
    description: "Absolute path to the output directory holding the Report + projections."
    value: ${{ steps.run.outputs.out-dir }}
  sarif-file:
    description: "Path to the materialized SARIF file (for a codeql-action upload step)."
    value: ${{ steps.run.outputs.sarif-file }}
  scan-truncated:
    description: "'true' when the scan stopped before assessing every advisory (scan-timeout, a job timeout or a cancellation), 'false' when it assessed them all; empty when the scanner exited before writing its Report."
    value: ${{ steps.run.outputs.scan-truncated }}

runs:
  using: composite
  steps:
    - name: Fetch the versioned scanner release (optional checksum pin)
      id: fetch
      shell: bash
      env:
        # github.token is not auto-injected into a composite action's step env — map it explicitly.
        GH_TOKEN: ${{ inputs.scanner-token != '' && inputs.scanner-token || github.token }}
        SCANNER_VERSION: ${{ inputs.scanner-version }}
        SCANNER_SHA256: ${{ inputs.scanner-sha256 }}
        SCANNER_REPO: ${{ inputs.scanner-repo }}
      run: |
        set -euo pipefail

        # Resolve the input to the exact vX.Y.Z to download. The script fails loud on an empty,
        # placeholder or malformed version, on an alias that names no single release, and on a
        # scanner-sha256 paired with an alias. An exact vX.Y.Z passes through untouched.
        SCANNER_VERSION="$(bash "$GITHUB_ACTION_PATH/scripts/resolve-scanner-version.sh")"

        WORK="$RUNNER_TEMP/ferralon-assay"
        mkdir -p "$WORK"
        TARBALL="ferralon-assay-scanner_${SCANNER_VERSION}_linux_amd64.tar.gz"
        DEST="$WORK/$TARBALL"

        echo "==> Fetching $TARBALL @ $SCANNER_VERSION from $SCANNER_REPO"
        if command -v gh >/dev/null 2>&1; then
          # gh handles public + private release-asset download and auth uniformly.
          gh release download "$SCANNER_VERSION" --repo "$SCANNER_REPO" \
            --pattern "$TARBALL" --output "$DEST" --clobber
        else
          # Fallback: the public release-asset URL (works unauthenticated for a public repo).
          url="https://github.com/${SCANNER_REPO}/releases/download/${SCANNER_VERSION}/${TARBALL}"
          auth=()
          [ -n "${GH_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GH_TOKEN}")
          curl -fSL --retry 3 "${auth[@]}" -o "$DEST" "$url"
        fi

        # --- optional checksum pin: enforced ONLY when the consumer set scanner-sha256 -----------
        # Default (empty) selects the scanner by version tag alone. A consumer who set scanner-sha256
        # is freezing exact bytes: verify and fail loud on any mismatch. We compute the digest either
        # way so the log records what ran, then gate on it only when a pin is configured.
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$DEST" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "$DEST" | awk '{print $1}')"
        fi
        if [ -n "$SCANNER_SHA256" ] && [ "$SCANNER_SHA256" != "REPLACE_WITH_RELEASE_SHA256" ]; then
          if [ "$actual" != "$SCANNER_SHA256" ]; then
            echo "::error::ferralon-assay: scanner checksum MISMATCH — refusing to run bytes that do not match your pinned scanner-sha256." >&2
            echo "  expected (your pin): $SCANNER_SHA256" >&2
            echo "  actual   (fetched):  $actual" >&2
            exit 1
          fi
          echo "==> Checksum verified against your pinned scanner-sha256 — $actual"
        else
          echo "==> Fetched $TARBALL @ $SCANNER_VERSION (sha256 $actual); no scanner-sha256 pin set — pass one to enforce exact bytes."
        fi

        tar -xzf "$DEST" -C "$WORK"

        # ---- wiring: DERIVED from what the tarball actually carried ----------------------------
        # This block used to hold two hand-maintained literal lists — a chmod list and a symlink
        # list — each naming three of the baked analyzer plugins. Every language added since was
        # extracted onto disk and left unreachable, because nothing reconciled either list with the
        # release's target table. Deriving from the extraction is strictly stronger than deriving
        # from any declared list: it cannot drift from what the PINNED release really carries, so an
        # asset missing from the download fails loudly here instead of presenting, much later, as a
        # language that mysteriously cannot be analyzed.
        #
        # The block between the two markers is extracted and run VERBATIM by the in-module lock
        # cmd/ferralon-assay/action_wiring_test.go. Keep it self-contained: its only input is $WORK
        # and the files sitting in it.
        # >>> BEGIN plugin wiring >>>
        # The CLI is not optional — every later step execs it.
        if [ ! -f "$WORK/ferralon-assay-scan" ]; then
          echo "::error::ferralon-assay: the release tarball carried no scanner CLI (ferralon-assay-scan) — refusing to continue." >&2
          echo "  extracted into $WORK:" >&2
          ls -A "$WORK" | sed 's/^/    /' >&2
          exit 1
        fi
        chmod +x "$WORK/ferralon-assay-scan"

        # Per-language analyzer discovery. The CLI resolves the analyzer for the DETECTED language
        # via exec.LookPath("assay-plugin-<lang>") (plugin.BinaryName), which is not the
        # name the release ships the binaries under. So each extracted plugin is symlinked to its
        # lookup name in a TRANSIENT plugin dir (never part of the released tarball) and that dir is
        # exposed on PATH. Two namespaces, one bridge: this loop.
        PLUGIN_PATH_DIR="$WORK/plugin-path"
        mkdir -p "$PLUGIN_PATH_DIR"
        wired=0
        for asset in "$WORK"/ferralon-assay-scan-plugin*; do
          [ -f "$asset" ] || continue   # nothing matched: the glob stayed literal
          suffix="${asset#"$WORK"/ferralon-assay-scan-plugin}"
          if [ -z "$suffix" ]; then
            # THE ONE ASYMMETRY, and the reason this is not a plain "${asset##*-}" split. Go's
            # analyzer ships as the bare name `ferralon-assay-scan-plugin`: it was the only analyzer
            # when the asset names were frozen, so it never got a `-go` suffix. The names cannot be
            # regularized after the fact either — `publish.sh --action-only` re-cuts this Action
            # against an ALREADY-PUBLISHED release, so an Action expecting tidier asset names would
            # break against the very tarball it is pinned to. The asymmetry stays; this arm absorbs
            # it, and every other plugin is `ferralon-assay-scan-plugin-<lang>`.
            lang=go
          else
            lang="${suffix#-}"
          fi
          chmod +x "$asset"
          ln -sf "$asset" "$PLUGIN_PATH_DIR/assay-plugin-$lang"
          # Scanners released before v0.4.0 look the analyzer up as tegron-plugin-<lang>. This link
          # serves a workflow whose scanner-version names one of them.
          ln -sf "$asset" "$PLUGIN_PATH_DIR/tegron-plugin-$lang"
          echo "==> wired assay-plugin-$lang -> $(basename "$asset")"
          wired=$((wired + 1))
        done

        # Fail closed. Exporting an empty plugin dir hands the CLI a PATH with nothing on it, which
        # turns a packaging failure into a confusing analysis failure several steps downstream.
        if [ "$wired" -eq 0 ]; then
          echo "::error::ferralon-assay: the release tarball carried no analyzer plugins — refusing to export an empty plugin dir." >&2
          echo "  extracted into $WORK:" >&2
          ls -A "$WORK" | sed 's/^/    /' >&2
          exit 1
        fi
        echo "==> $wired analyzer plugin(s) reachable by lookup name"
        # <<< END plugin wiring <<<
        echo "bin-dir=$WORK" >> "$GITHUB_OUTPUT"
        echo "plugin-path-dir=$PLUGIN_PATH_DIR" >> "$GITHUB_OUTPUT"

    # The corpus checkout directory is a FIXED, configuration-derived path, spelled out identically
    # here and in the run step below. It is deliberately NOT passed between the steps as a step
    # output: a step output only exists when the step ran and succeeded, so consuming one would make
    # "the corpus was requested" indistinguishable from "the fetch worked" — and a failed fetch would
    # then present as an unconfigured run and silently downgrade to built-in intel. The duplication
    # is the point; keep the two literals in sync.
    #
    # The bundle route writes to a second fixed path, $RUNNER_TEMP/ferralon-assay-corpus-bundle/
    # <policy>.jsonl.gz, and the run step picks it by the file's existence rather than by this
    # step's outputs. The script only moves the bundle there after every check passed and wipes the
    # directory first, so the file exists iff a verified bundle does; a failed pin fails this step
    # and the job. The step's route/git-ref outputs steer the git fetch below, which runs when the
    # bundle route did not apply; its signer outputs only feed the run step's Report disclosure.
    #
    # Its signals-path output is the release's signals.json.gz, verified against the signed
    # bundles.json; it is set whenever the step read a release, on route=bundle and on a
    # manifest-only policy's route=git, and the run step passes it as -advisory-signals. A release
    # that cannot supply verified signals fails this step, so the output never stands for "no
    # signals": a run that reaches the scan with a release behind it has them.
    #
    # cosign is installed here, in the bundle route only, from the sigstore/cosign release pinned by
    # version and sha256 in scripts/install-cosign.sh, and put first on PATH so the fetch script runs
    # that binary and no other. The signer outputs exist only when route=bundle, i.e. only for the
    # signature the scanner's bundle was verified under.
    - name: Fetch the advisory corpus bundle (release asset, signature-verified, digest-pinned)
      id: corpus-bundle
      if: inputs.advisory-corpus == '' && inputs.advisory-corpus-repo != '' && inputs.advisory-corpus-policy != ''
      shell: bash
      env:
        CORPUS_REPO: ${{ inputs.advisory-corpus-repo }}
        CORPUS_REF: ${{ inputs.advisory-corpus-ref }}
        CORPUS_POLICY: ${{ inputs.advisory-corpus-policy }}
        CORPUS_SIGNER_IDENTITY: ${{ inputs.corpus-signer-identity }}
        CORPUS_SIGNER_ISSUER: ${{ inputs.corpus-signer-issuer }}
      run: |
        set -euo pipefail
        COSIGN_DIR="$RUNNER_TEMP/ferralon-assay-cosign"
        DEST="$COSIGN_DIR" bash "$GITHUB_ACTION_PATH/scripts/install-cosign.sh"
        PATH="$COSIGN_DIR:$PATH" DEST="$RUNNER_TEMP/ferralon-assay-corpus-bundle" bash "$GITHUB_ACTION_PATH/scripts/fetch-corpus-bundle.sh"

    - name: Fetch the advisory corpus (unauthenticated, shallow + sparse)
      # A CONFIGURATION condition, not a success condition: it asks whether a corpus was requested,
      # never whether anything succeeded. The one exception is the bundle route above having
      # delivered a verified bundle, which makes this fetch redundant.
      if: inputs.advisory-corpus == '' && inputs.advisory-corpus-repo != '' && steps.corpus-bundle.outputs.route != 'bundle'
      shell: bash
      env:
        CORPUS_REPO: ${{ inputs.advisory-corpus-repo }}
        # The bundle step's resolved release tag when it ran (so a manifest-only policy reads the
        # same corpus state the release names), else the input ref unchanged.
        CORPUS_REF: ${{ steps.corpus-bundle.outputs.git-ref || inputs.advisory-corpus-ref }}
        CORPUS_POLICY: ${{ inputs.advisory-corpus-policy }}
      run: |
        set -euo pipefail
        DEST="$RUNNER_TEMP/ferralon-assay-corpus"
        rm -rf "$DEST"
        mkdir -p "$DEST"

        # Present NO credential. The corpus is a public repository by design — a stranger's runner
        # has to be able to fetch it with nothing — so any token that happens to be in scope is
        # withheld on purpose. An accidentally-authenticated fetch here would make a PRIVATE corpus
        # appear to work for us and 404 for every real consumer, which is exactly the failure this
        # withholding is meant to surface at once.
        export GIT_TERMINAL_PROMPT=0
        unset GITHUB_TOKEN GH_TOKEN GIT_ASKPASS SSH_ASKPASS || true

        git init -q "$DEST"
        git -C "$DEST" remote add origin "https://github.com/${CORPUS_REPO}.git"

        # Sparse BEFORE any checkout, so excluded paths are never materialized. Non-cone
        # (gitignore-style) patterns: records are filed as <YYYY>/<MM>/<ID>.json plus
        # unknown/<ID>.json and are resolved through the root manifest. LICENSE and NOTICE carry the
        # corpus's CC-BY attribution terms and travel with the data they cover.
        sparse=(
          '/manifest.json'
          '/LICENSE'
          '/NOTICE'
          '/[0-9][0-9][0-9][0-9]/[0-9][0-9]/*.json'
          '/unknown/*.json'
        )
        if [ -n "$CORPUS_POLICY" ]; then
          if ! [[ "$CORPUS_POLICY" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::ferralon-assay: advisory-corpus-policy '$CORPUS_POLICY' is not a policy id (lowercase letters, digits, '-')." >&2
            exit 1
          fi
          sparse+=("/policies/$CORPUS_POLICY/manifest.json")
        fi
        git -C "$DEST" sparse-checkout set --no-cone "${sparse[@]}"

        # --depth 1 bounds history (the corpus is small today but its history only grows);
        # --filter=blob:none makes the sparse selection bound the BYTES fetched rather than merely
        # the working tree; --no-tags drops refs that are never read. Fetching by ref name handles a
        # branch, a tag and a commit SHA uniformly.
        git -C "$DEST" -c credential.helper= -c http.https://github.com/.extraheader= \
          fetch --depth 1 --no-tags --filter=blob:none origin "$CORPUS_REF"
        git -C "$DEST" -c credential.helper= -c http.https://github.com/.extraheader= \
          checkout -q FETCH_HEAD

        # Fail loud on a fetch that "succeeded" and delivered nothing readable. This is a
        # convenience diagnostic, NOT the safety net — the scanner's own requirement gate (declared
        # below from configuration) is what actually guarantees a corpus-less run cannot pass.
        if [ ! -f "$DEST/manifest.json" ]; then
          echo "::error::ferralon-assay: advisory corpus fetched from $CORPUS_REPO@$CORPUS_REF has no manifest.json." >&2
          echo "  Check that advisory-corpus-repo is PUBLIC and that advisory-corpus-ref exists." >&2
          exit 1
        fi
        # A policy scans the policy's member set: its manifest indexes the same record files by the
        # same repository-root-relative paths, so it replaces the root manifest in place.
        if [ -n "$CORPUS_POLICY" ]; then
          if [ ! -f "$DEST/policies/$CORPUS_POLICY/manifest.json" ]; then
            echo "::error::ferralon-assay: advisory corpus $CORPUS_REPO@$CORPUS_REF has no policy '$CORPUS_POLICY' (policies/$CORPUS_POLICY/manifest.json)." >&2
            exit 1
          fi
          cp "$DEST/policies/$CORPUS_POLICY/manifest.json" "$DEST/manifest.json"
          echo "==> Using policy '$CORPUS_POLICY'"
        fi
        echo "==> Advisory corpus checked out at $DEST ($CORPUS_REPO@$CORPUS_REF)"

    - name: Resolve the dependency cache
      id: depcache
      # scope is what the persisted cache may hold: all, uncredentialed or none. 'auto' persists
      # everything only when the event payload says the repository is private or internal;
      # repository.private is a required field of every payload that carries a repository, and a
      # payload without one (schedule) reads as empty here, so it counts as public. On a public
      # repository the scanner keeps every tarball from a registry the .npmrc holds an auth
      # entry for in cache-dir, which is never persisted, and writes only the rest to
      # uncredentialed-dir, which is.
      shell: bash
      env:
        PERSIST_DEPENDENCY_CACHE: ${{ inputs.persist-dependency-cache }}
        REPO_PRIVATE: ${{ github.event.repository.private }}
        REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      run: |
        persisted="$RUNNER_TEMP/ferralon-assay-deps"
        case "$PERSIST_DEPENDENCY_CACHE" in
          never) scope=none ;;
          always) scope=all ;;
          auto)
            if [ "$REPO_PRIVATE" = "true" ] || [ "$REPO_VISIBILITY" = "private" ] || [ "$REPO_VISIBILITY" = "internal" ]; then
              scope=all
            else
              scope=uncredentialed
            fi
            ;;
          *)
            echo "::error::ferralon-assay: persist-dependency-cache '$PERSIST_DEPENDENCY_CACHE' is not one of auto, always, never." >&2
            exit 1
            ;;
        esac
        if [ "$scope" = "uncredentialed" ]; then
          cache_dir="$RUNNER_TEMP/ferralon-assay-deps-run"
          uncredentialed_dir="$persisted"
        else
          cache_dir="$persisted"
          uncredentialed_dir=""
        fi
        {
          echo "scope=$scope"
          echo "cache-dir=$cache_dir"
          echo "uncredentialed-dir=$uncredentialed_dir"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the dependency code cache
      # Keyed on every lockfile the scanner reads, so the same locks restore the same verified
      # tarballs; restore-keys reuses an earlier cache after a lock changes, and the scanner
      # re-verifies every file it reads against the lock either way. The key's v1-<scope> segment
      # keeps a cache saved under one scope, or by an earlier format, from ever restoring under
      # another: an 'all' cache can hold credentialed tarballs.
      if: >-
        inputs.dependency-code != 'off' &&
        steps.depcache.outputs.scope != 'none' &&
        hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/yarn.lock', '**/pnpm-lock.yaml', '!**/node_modules/**') != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/ferralon-assay-deps
        key: ferralon-assay-deps-v1-${{ steps.depcache.outputs.scope }}-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/yarn.lock', '**/pnpm-lock.yaml', '!**/node_modules/**') }}
        restore-keys: |
          ferralon-assay-deps-v1-${{ steps.depcache.outputs.scope }}-${{ runner.os }}-

    - name: Run the Ferralon Assay
      id: run
      shell: bash
      env:
        # The fetched build reads its own surface toggles under brand.EnvPrefix, which is ASSAY.
        # Map this action's inputs onto that prefix so the caller never writes the prefix itself.
        # '0' = off, '1' = on; keep the non-empty value on the truthy branch (the GitHub ternary
        # footgun).
        #
        # These three names MUST track brand.EnvPrefix. cmd/ferralon-assay/run.go (surfaceToggles)
        # reads them with a plain os.Getenv and has no fallback -- so a stale prefix here is not
        # a warning, it is a silently ignored opt-out. That is safe only because every release tag of
        # action.yml names the exact scanner-version it was cut with, so a consumer on a tag always
        # gets a matched pair; main's vX.Y alias floats only across patch releases, which keep these
        # names.
        ASSAY_ISSUE: ${{ inputs.issue != 'false' && '1' || '0' }}
        ASSAY_PR_COMMENT: ${{ inputs.pr-comment != 'false' && '1' || '0' }}
        ASSAY_CODE_SCANNING: ${{ inputs.code-scanning != 'false' && '1' || '0' }}
        # M4 subject-toolchain-reachability gate (opt-in, default OFF). Read by run.go; only an
        # explicit affirmative ('true') enables it — the ternary yields the literal 'false'
        # otherwise, which envEnabled reads as off.
        ASSAY_SUBJECT_TOOLCHAIN_REACHABILITY: ${{ inputs.subject-toolchain-reachability == 'true' }}
        # Read by run.go (-library-entrypoints falls back to it); data, never parsed by the shell.
        ASSAY_LIBRARY_ENTRYPOINTS: ${{ inputs.library-entrypoints }}
        # JS dependency code. Empty inherits the scanner's default. The directories come from the
        # depcache step; both are left unset for 'off'. Env vars rather than flags, so a scanner
        # release that predates them ignores them: one that predates the uncredentialed cache
        # writes every tarball to the unpersisted cache-dir and leaves the persisted one empty.
        ASSAY_DEPENDENCY_CODE: ${{ inputs.dependency-code }}
        ASSAY_DEPENDENCY_CACHE: ${{ inputs.dependency-code != 'off' && steps.depcache.outputs.cache-dir || '' }}
        ASSAY_DEPENDENCY_UNCREDENTIALED_CACHE: ${{ inputs.dependency-code != 'off' && steps.depcache.outputs.uncredentialed-dir || '' }}
        # Empty sets no limit. An env var, so a scanner release that predates it ignores it.
        ASSAY_SCAN_TIMEOUT: ${{ inputs.scan-timeout }}
        GITHUB_TOKEN: ${{ github.token }}
        # Route every ${{ }} value through the step env and reference it as a shell $VAR below,
        # never interpolating `${{ inputs.* }}` directly into the run script. A directly-inlined
        # expression is substituted as literal text before bash parses the line, so an input whose
        # value happens to contain shell syntax (e.g. a branch/ref name feeding `revision`) would be
        # evaluated — the classic Actions template-injection footgun. Passing through env makes the
        # value plain data the shell never re-parses.
        BIN_DIR: ${{ steps.fetch.outputs.bin-dir }}
        PLUGIN_PATH_DIR: ${{ steps.fetch.outputs.plugin-path-dir }}
        IN_PLUGIN_GO: ${{ inputs.plugin-go }}
        IN_MODE: ${{ inputs.mode }}
        IN_TARGET: ${{ inputs.target }}
        IN_OUT: ${{ inputs.out }}
        IN_SUBJECT_REPO: ${{ inputs.subject-repo }}
        IN_REVISION: ${{ inputs.revision }}
        IN_COMMIT: ${{ inputs.commit }}
        IN_STATE_REPO: ${{ inputs.state-repo }}
        IN_STATE_REF: ${{ inputs.state-ref }}
        IN_STATE_TOKEN: ${{ inputs.state-token }}
        IN_INCLUDE_HOUSE_CANARIES: ${{ inputs.include-house-canaries }}
        IN_ADVISORY_CORPUS: ${{ inputs.advisory-corpus }}
        IN_ADVISORY_CORPUS_REPO: ${{ inputs.advisory-corpus-repo }}
        IN_ADVISORY_CORPUS_POLICY: ${{ inputs.advisory-corpus-policy }}
        # The release's signals.json.gz, verified by the bundle step; empty when no release was read.
        IN_ADVISORY_SIGNALS: ${{ steps.corpus-bundle.outputs.signals-path }}
        # THE REQUIREMENT DECLARATION. Computed from this action's INPUTS ALONE — it names no step,
        # reads no step output, and consults no step status, so it says "this workflow was
        # configured to scan against a corpus", never "a fetch worked". That distinction is the
        # whole mechanism: if the requirement were derived from the fetch's success, a failed fetch
        # would be byte-identical to an unconfigured run and the scan would silently degrade to
        # built-in intel with nothing to show for it. Under a declared requirement the scanner fails
        # the run when no corpus resolves, and equally when one resolves with zero records.
        # '1'/'0' rather than '1'/'': the scanner parses this as a boolean and REFUSES to guess on an
        # unparseable value, so the falsey branch has to be a real boolean literal, not an empty
        # string. '0' is exactly equivalent to leaving it unset, which keeps the built-in-intel path
        # — a supported, unchanged configuration — working for every consumer who sets no corpus.
        ASSAY_ADVISORY_CORPUS_REQUIRED: ${{ (inputs.advisory-corpus != '' || inputs.advisory-corpus-repo != '') && '1' || '0' }}
        # THE POLICY DECLARATION. Declaring the policy is what makes the scanner build its work set
        # from the corpus; without it the corpus is a fact source only. It is set only for the
        # repo-fetch route, because advisory-corpus-policy is ignored when advisory-corpus is set.
        # Passed as an env var rather than a flag on purpose: a scanner release that predates it
        # ignores an unknown env var, whereas an unknown flag fails the run.
        ASSAY_ADVISORY_CORPUS_POLICY: ${{ (inputs.advisory-corpus == '' && inputs.advisory-corpus-repo != '') && inputs.advisory-corpus-policy || '' }}
        # THE VERIFIED SIGNER. Unlike the two declarations above, these ARE step outputs on purpose:
        # they exist only when the bundle step verified the release signature and produced the
        # bundle this run reads, so the Report records a signer exactly when one was verified, and
        # never the corpus-signer-* inputs echoed back. Env vars, like the policy, so a scanner release
        # that predates them ignores them.
        ASSAY_ADVISORY_CORPUS_SIGNER_IDENTITY: ${{ steps.corpus-bundle.outputs.route == 'bundle' && steps.corpus-bundle.outputs.corpus-signer-identity || '' }}
        ASSAY_ADVISORY_CORPUS_SIGNER_ISSUER: ${{ steps.corpus-bundle.outputs.route == 'bundle' && steps.corpus-bundle.outputs.corpus-signer-issuer || '' }}
        # --- self-cleanup + advisory-rescan plumbing -------------------------------------------------
        # FERRALON_LINK_TO_CONSOLE is the ONLY switch: unless it parses as true the scanner resolves
        # every Ferralon endpoint to empty and behaves exactly as the OSS build does, whatever the two
        # URL overrides below say. The endpoint a linked run actually uses is baked into the pinned
        # release at build time, which is why the caller's workflow names no host.
        FERRALON_LINK_TO_CONSOLE: ${{ inputs.link-to-console }}
        # Operator opt-out for the removal ladder ONLY — not the link. With link-to-console on, a
        # confirmed signed revoke still beacons and is reported; self-cleanup-on-revoke=false only
        # holds the deletion of the workflow file / state ref. Forwarded raw (true/false) so the
        # binary sees the operator's explicit choice; honored by a release carrying the gate.
        FERRALON_SELF_CLEANUP_ON_REVOKE: ${{ inputs.self-cleanup-on-revoke }}
        # The rest give the scanner the run context it needs to
        # (a) forward advisory-rescan correlation metadata on the beacon and surface it in the summary,
        # and (b) actuate the removal ladder (delete the workflow file / open the removal PR / disable
        # + Issue) against the RIGHT branch. GITHUB_REPOSITORY / GITHUB_WORKSPACE / GITHUB_SHA and the
        # ACTIONS_ID_TOKEN_REQUEST_* pair (present when the caller grants id-token: write) are default
        # Actions env vars already visible to this step, so they are not re-mapped here.
        FERRALON_INGEST_URL: ${{ inputs.ingest-url }}
        # A linked run's report push is ALSO canonical-ref-gated: it fires when the run ASSESSED the
        # repository's canonical ref, not merely when it was TRIGGERED on the default branch. The
        # canonical ref is .github/ferralon.yml `analyze.ref` when the repository sets one, else the
        # default branch below — so with no analyze.ref the gate reduces to GITHUB_REF_NAME == that
        # default branch, exactly as before. FERRALON_DEFAULT_BRANCH therefore stays wired as the
        # no-analyze.ref fallback. Nothing more is mapped here for the analyzed ref: the analyze.ref
        # redirect is resolved by the scanner itself, in this same process, so the gate already has
        # it in hand. GITHUB_REF_NAME and the ACTIONS_ID_TOKEN_REQUEST_* OIDC pair are default
        # Actions env vars already visible to this step (the caller must grant id-token: write), so
        # only the endpoint override is mapped here.
        FERRALON_RUNS_URL: ${{ inputs.runs-url }}
        FERRALON_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        FERRALON_EVENT_ACTION: ${{ github.event.action }}
        FERRALON_CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      run: |
        set -euo pipefail
        BIN="$BIN_DIR/ferralon-assay-scan"

        # Expose the per-language plugin symlinks (assay-plugin-<lang>) on PATH so the CLI resolves
        # the analyzer for the DETECTED language itself. -plugin-go is a single-path override applied
        # to WHATEVER language is detected, so it must NOT be passed unconditionally — a forced Go
        # plugin path would exec the Go analyzer against a Python or JS tree. Pass it ONLY when the
        # caller explicitly set the plugin-go input (an escape hatch for a prebuilt Go plugin).
        export PATH="$PLUGIN_PATH_DIR:$PATH"

        mkdir -p "$IN_OUT"
        args=(
          "$IN_MODE"
          -target "$IN_TARGET"
          -out "$IN_OUT"
          -subject-repo "$IN_SUBJECT_REPO"
          -revision "$IN_REVISION"
          -commit "$IN_COMMIT"
        )
        if [ -n "$IN_PLUGIN_GO" ]; then
          args+=(-plugin-go "$IN_PLUGIN_GO")
        fi
        # StateStore selection: the consumer pins the ref (cross-team contract) and, on the default
        # branch, the owner/repo to persist to. Omitting -repo keeps a PR run stateless.
        if [ -n "$IN_STATE_REPO" ]; then
          args+=(-repo "$IN_STATE_REPO")
        fi
        if [ -n "$IN_STATE_REF" ]; then
          args+=(-ref "$IN_STATE_REF")
        fi
        if [ -n "$IN_STATE_TOKEN" ]; then
          args+=(-token "$IN_STATE_TOKEN")
        fi
        # First-party house-canary opt-in: default off so a normal scan is unchanged; the
        # Ferralon demo scan sets it so the app-level DOS canary surfaces as a reachable_candidate.
        if [ "$IN_INCLUDE_HOUSE_CANARIES" = "true" ]; then
          args+=(-include-house-canaries)
        fi
        # Advisory corpus. An explicit path wins; otherwise a requested repo fetch lands at the
        # fixed path the fetch step above uses. That path is RECOMPUTED here from configuration
        # rather than read back from the fetch step, so a fetch that failed or was skipped still
        # produces the flag and the scanner hits its own missing-corpus error under the requirement
        # declared above — instead of the flag quietly disappearing and the run downgrading.
        # A verified policy bundle, when the bundle step produced one, takes the tree's place; it
        # exists only if every pin check passed (see the bundle step).
        if [ -n "$IN_ADVISORY_CORPUS" ]; then
          args+=(-advisory-corpus "$IN_ADVISORY_CORPUS")
        elif [ -n "$IN_ADVISORY_CORPUS_REPO" ]; then
          CORPUS_BUNDLE="$RUNNER_TEMP/ferralon-assay-corpus-bundle/$IN_ADVISORY_CORPUS_POLICY.jsonl.gz"
          if [ -n "$IN_ADVISORY_CORPUS_POLICY" ] && [ -f "$CORPUS_BUNDLE" ]; then
            args+=(-advisory-corpus "$CORPUS_BUNDLE")
          else
            args+=(-advisory-corpus "$RUNNER_TEMP/ferralon-assay-corpus")
          fi
        fi
        # EPSS/KEV signals. The release's verified signals.json.gz when the bundle step read a
        # release; otherwise nothing is passed, and a corpus directory's own signals.json is the
        # scanner's default. A flag rather than the env channel on purpose: verified signals a
        # scanner release could not read must fail the run ("flag provided but not defined:
        # -advisory-signals"), not be ignored, as an unknown env var would be.
        if [ -n "$IN_ADVISORY_SIGNALS" ]; then
          args+=(-advisory-signals "$IN_ADVISORY_SIGNALS")
        fi

        # The marker dates the launch, so the outputs below name only files this run wrote.
        scan_marker="$(mktemp "$RUNNER_TEMP/scan-start.XXXXXX")"

        # On a job timeout or cancellation the runner signals this shell, not the scanner, and
        # bash runs a trap only once its foreground child exits. So the scanner runs in the
        # background and the trap forwards TERM (a background job ignores INT); the scanner then
        # stops analysis and publishes what it has. Only the first signal is forwarded: the runner
        # follows SIGINT with SIGTERM, and a second signal makes the scanner exit unpublished. A
        # trap interrupts wait, so wait again until the scanner itself has exited.
        "$BIN" "${args[@]}" &
        scan_pid=$!
        signalled=0
        forwarded=0
        trap 'signalled=1; if [ "$forwarded" = 0 ]; then forwarded=1; kill -TERM "$scan_pid" 2>/dev/null || true; fi' INT TERM
        while :; do
          signalled=0
          rc=0
          wait "$scan_pid" || rc=$?
          [ "$signalled" = 1 ] || break
        done

        # Set on every exit, stopped or failed, but only for files this run wrote, so an always()
        # step never gets a path to a missing file or to one an earlier run left in `out`.
        OUT_ABS="$(cd "$IN_OUT" && pwd)"
        if [ -f "$OUT_ABS/report.json" ] && [ ! "$OUT_ABS/report.json" -ot "$scan_marker" ]; then
          echo "out-dir=$OUT_ABS" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$OUT_ABS/report.sarif.json" ] && [ ! "$OUT_ABS/report.sarif.json" -ot "$scan_marker" ]; then
          echo "sarif-file=$OUT_ABS/report.sarif.json" >> "$GITHUB_OUTPUT"
        fi
        rm -f "$scan_marker"
        exit "$rc"
