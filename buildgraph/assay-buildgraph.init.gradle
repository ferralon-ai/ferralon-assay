// Registers assayBuildGraph on every project. The task writes the project's runtimeClasspath,
// compileClasspath and testRuntimeClasspath, and beside runtimeClasspath every other resolvable
// *RuntimeClasspath, as Gradle resolved each: components, the edges between them, and each
// artifact's file. Beside runtimeClasspath it also resolves every other resolvable configuration
// (an agent or a driver a distribution copies in, say), each leniently: one that fails records
// its failure rather than failing the task. Everything the action reads is captured while the
// task is configured, so it never reaches back into the project at execution time.
//
// It also records what the producer needs to tell whether those configurations are everything
// the build installs: each task's type, the actions added to it beside its type's own, the
// tasks it depends on and the input files it reads from outside the build, and every
// resolution the root build makes, whatever resolved it.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ModuleComponentSelector
import org.gradle.api.artifacts.component.ProjectComponentSelector
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.repositories.FlatDirectoryArtifactRepository
import org.gradle.api.artifacts.repositories.IvyArtifactRepository
import org.gradle.api.artifacts.repositories.UrlArtifactRepository
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

def assayOut = System.getProperty('assay.out')
def gradleVersion = gradle.gradleVersion
def javaVersion = System.getProperty('java.version')
def javaVendor = System.getProperty('java.vendor')

// Every build in the tree evaluates its settings with this script applied, a nested included
// build too, though the root build never lists it. Each included build records its directory,
// so the build logic it holds is hashed as input. The root build records the builds it includes
// directly, so a nested build that never ran this script cannot go unrecorded.
def record = { String kind, String text ->
    def d = new File(assayOut, kind)
    d.mkdirs()
    new File(d, UUID.randomUUID().toString() + '.txt').setText(text, 'UTF-8')
}
if (gradle.parent != null) {
    gradle.settingsEvaluated { s -> record('included', s.rootDir.absolutePath) }
} else {
    gradle.projectsEvaluated { g -> g.includedBuilds.each { b -> record('direct', b.projectDir.absolutePath) } }
}

// A resolution failure's own message rarely names the cause; the transport error (a 401, a
// missing artifact) sits further down the cause chain.
def failureText = { Throwable top ->
    def lines = []
    def seen = [] as Set
    def queue = [top]
    while (!queue.isEmpty()) {
        def e = queue.remove(0)
        if (e == null || !seen.add(System.identityHashCode(e))) {
            continue
        }
        lines << String.valueOf(e.message)
        if (e.metaClass.respondsTo(e, 'getCauses')) {
            queue.addAll(e.causes)
        }
        queue << e.cause
    }
    lines.join('\n')
}

// Every resolution the root build makes, with the files it resolved: a configuration's, a build
// script classpath's (marked script, or path "classpath" when no project's), and a detached
// configuration's, which no project lists.
// The producer finds each file it resolved among the graph's own; one that is not was installed
// from outside the configurations it collected. An included build's resolutions are its build
// logic's, and its own listener never records them.
//
// A resolution whose only unresolved dependencies are on a project, or on a detached
// configuration's own unspecified root (the dependency-management plugin's, on Gradle 9, declare
// unspecified:unspecified:unspecified, and that root has no variants), is read leniently: neither
// carries a third-party file, and every module file it did resolve is still recorded. A project
// whose own coordinate is an external one gets no such exemption, and neither does a file that
// failed to download beside them. Any other failure is recorded as one.
// A project's build script classpath records as :path:classpath, the path a project's own
// configuration named classpath would have, so each is told apart by identity.
def scriptResolutions = Collections.newSetFromMap(new IdentityHashMap())
if (gradle.parent == null) {
    gradle.addListener(new DependencyResolutionListener() {
        void beforeResolve(ResolvableDependencies d) {}
        void afterResolve(ResolvableDependencies d) {
            def doc = [path: d.path, script: scriptResolutions.contains(d)]
            def files = { set ->
                set.collect { a -> [file: a.file.absolutePath, project: a.id.componentIdentifier instanceof ProjectComponentIdentifier] }
            }
            try {
                doc.artifacts = files(d.artifacts.artifacts)
            } catch (Exception e) {
                doc.failure = failureText(e)
                try {
                    def rr = d.resolutionResult
                    def self = rr.root.moduleVersion
                    def unspecified = { g, n, v -> g == 'unspecified' && n == 'unspecified' && v == 'unspecified' }
                    def detachedRoot = self != null && unspecified(self.group, self.name, self.version) &&
                        !(rr.root.id instanceof ProjectComponentIdentifier)
                    def unresolved = rr.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
                    def own = { r ->
                        r instanceof ProjectComponentSelector ||
                            (detachedRoot && r instanceof ModuleComponentSelector && unspecified(r.group, r.module, r.version))
                    }
                    if (!unresolved.isEmpty() && unresolved.every { own(it.requested) }) {
                        // A lenient view also drops a file that failed to download; only the
                        // unresolved selectors themselves may fail.
                        def view = d.artifactView { lenient(true) }.artifacts
                        def leaves
                        leaves = { Throwable x ->
                            if (x.metaClass.respondsTo(x, 'getSelector')) {
                                return [x]
                            }
                            def causes = x.metaClass.respondsTo(x, 'getCauses') ? x.causes : (x.cause == null ? [] : [x.cause])
                            causes.isEmpty() ? [x] : causes.collectMany { leaves(it) }
                        }
                        def stray = view.failures.collectMany { leaves(it) }.findAll {
                            !(it.metaClass.respondsTo(it, 'getSelector') && own(it.selector))
                        }
                        if (stray.isEmpty()) {
                            doc.artifacts = files(view.artifacts)
                            doc.remove('failure')
                        } else {
                            doc.failure = failureText(stray[0])
                        }
                    }
                } catch (Exception ignored) {
                }
            }
            record('resolved', JsonOutput.toJson(doc))
        }
    })
}

// actionOrigin is the class an action added to a task came from: the closure or Action a doFirst
// or doLast wraps, unwrapped. A task type's own actions have none.
def actionOrigin = { a ->
    if (a.getClass().simpleName in ['StandardTaskAction', 'IncrementalTaskAction']) {
        return null
    }
    def x = a
    for (int i = 0; i < 4; i++) {
        def f = null
        for (def c = x.getClass(); c != null && f == null; c = c.superclass) {
            f = c.declaredFields.find { it.name in ['closure', 'action'] }
        }
        if (f == null) {
            break
        }
        f.accessible = true
        def y = f.get(x)
        if (y == null) {
            break
        }
        x = y
    }
    x.getClass().name
}

// The repositories the settings declare for every project, read once the settings are evaluated.
def settingsRepositories = []
gradle.settingsEvaluated { s ->
    if (s.hasProperty('dependencyResolutionManagement')) {
        settingsRepositories = s.dependencyResolutionManagement.repositories
    }
}

// foreignRoots are the directories p's resolutions fetch files into or from: the Gradle user home
// and the root of every file repository p, its build script or the settings declare (mavenLocal,
// a file: URL, a flatDir), each as given and canonical. A file under one was fetched, not made,
// however the paths nest. opaque names an Ivy repository with no URL, whose patterns alone say
// where its files are.
def foreignRoots = { p ->
    def dirs = [p.gradle.gradleUserHomeDir]
    def opaque = []
    (p.repositories.toList() + p.buildscript.repositories.toList() + settingsRepositories.toList()).each { r ->
        if (r instanceof FlatDirectoryArtifactRepository) {
            dirs.addAll(r.dirs)
        } else if (r instanceof UrlArtifactRepository) {
            if (r.url == null) {
                if (r instanceof IvyArtifactRepository) {
                    opaque << r.name
                }
            } else if (r.url.scheme == 'file') {
                dirs << new File(r.url)
            }
        }
    }
    [roots: dirs.collectMany { [it.absolutePath, it.canonicalPath] }.unique().sort(), opaque: opaque.unique().sort()]
}

// observeTasks records each of p's tasks. Reading a task's input files resolves whatever a lazy
// input would at execution, so the listener sees that resolution too.
def observeTasks = { p, List<String> foreign ->
    def root = p.rootDir.toPath()
    // A Gradle user home or file repository inside the checkout (CI caches set one) holds what
    // resolution fetched, so a file under it is outside the build however the paths nest.
    def fetched = foreign.collect { new File(it).toPath() }
    def tasks = []
    try {
        // assayBuildGraph is the task being configured, and only writes the graph.
        def names = p.tasks.names.toList() - ['assayBuildGraph']
        names.each { n ->
            def k = p.tasks.named(n).get()
            def t = [path: k.path, type: k.getClass().name.replace('_Decorated', '')]
            try {
                t.actions = k.actions.collect(actionOrigin).findAll { it != null }
                t.finalized_by = k.finalizedBy.getDependencies(k).collect { it.path }.sort()
                // A task ordered after another can package what it wrote, as a dependent can.
                def ordered = (k.mustRunAfter.getDependencies(k) + k.shouldRunAfter.getDependencies(k)).collect { it.path }
                t.depends = (k.taskDependencies.getDependencies(k).collect { it.path } + t.finalized_by + ordered).unique().sort()
                t.outside = k.inputs.files.files.findAll { f -> !f.toPath().startsWith(root) || fetched.any { f.toPath().startsWith(it) } }.collect { it.absolutePath }.sort()
            } catch (Exception e) {
                t.failure = String.valueOf(e.message)
            }
            tasks << t
        }
        if (p.tasks.names.toList() - ['assayBuildGraph'] != names) {
            tasks << [path: p.path, failure: 'tasks were registered while the tasks were observed']
        }
    } catch (Exception e) {
        tasks << [path: p.path, failure: String.valueOf(e.message)]
    }
    tasks
}

allprojects { p ->
    p.buildscript.configurations.all { c -> scriptResolutions << c.incoming }
    p.tasks.register('assayBuildGraph') { t ->
        def projectPath = p.path
        // The JDK the project's toolchain selects, which Kotlin's jvmToolchain sets too. Without
        // the java extension it is known only for a project with no classpath at all. A project
        // with an Android plugin, Kotlin Multiplatform's Android target included, is never known:
        // its Android code runs on Android's runtime, whatever the java extension says.
        def javaExt = p.extensions.findByName('java')
        def toolchain = javaExt != null && javaExt.hasProperty('toolchain') ? javaExt.toolchain.languageVersion.getOrNull() : null
        def android = p.plugins.any { it.class.name.startsWith('com.android.') }
        def toolchainKnown = !android && (javaExt != null || !p.configurations.any { it.canBeResolved && it.name.endsWith('Classpath') })
        def doc = [
            gradle     : gradleVersion,
            java       : javaVersion,
            java_vendor: javaVendor,
            path       : projectPath,
            dir        : p.projectDir.absolutePath,
            build_file : p.buildFile.absolutePath,
            build_dir  : p.layout.buildDirectory.get().asFile.absolutePath,
            user_home  : p.gradle.gradleUserHomeDir.absolutePath,
            root_dir   : p.rootDir.absolutePath,
            group      : String.valueOf(p.group),
            name       : p.name,
            version    : String.valueOf(p.version),
            jdk_toolchain: toolchain == null ? '' : String.valueOf(toolchain.asInt()),
            jdk_toolchain_known: toolchainKnown,
        ]
        // Other runtime classpaths: beside runtimeClasspath, ones such as
        // integrationTestRuntimeClasspath, resolved too; without it, Android variants or KMP
        // targets, which this producer does not choose between.
        def otherRuntime = p.configurations.findAll { it.canBeResolved && it.name.endsWith('RuntimeClasspath') }.collect { it.name }.sort()
        def names = ['runtimeClasspath', 'compileClasspath', 'testRuntimeClasspath']
        if (p.configurations.findByName('runtimeClasspath') != null) {
            names += otherRuntime.findAll { !names.contains(it) }
        }
        // Every other resolvable configuration, on every project: a distribution-only project with no
        // runtimeClasspath is where an agent or driver configuration is usually declared.
        // A configuration a plugin fills lazily (defaultDependencies, withDependencies) reads empty
        // here, so none is skipped for being empty.
        def extraNames = p.configurations.findAll { it.canBeResolved && !names.contains(it.name) && !otherRuntime.contains(it.name) }.collect { it.name }.sort()
        // Without runtimeClasspath, the other runtime classpaths are left uncollected (an Android
        // variant or a KMP target).
        def uncollected = otherRuntime.findAll { !names.contains(it) }
        // The coordinates the project publishes under beside group:name.
        def aliases = []
        def base = p.extensions.findByName('base')
        if (base != null && base.hasProperty('archivesName')) {
            aliases << String.valueOf(p.group) + ':' + base.archivesName.get()
        }
        p.extensions.findByName('publishing')?.publications?.each { pub ->
            if (pub.hasProperty('artifactId')) {
                aliases << String.valueOf(pub.groupId) + ':' + pub.artifactId
            } else if (pub.hasProperty('module')) {
                aliases << String.valueOf(pub.organisation) + ':' + pub.module
            }
        }
        def repos = foreignRoots(p)
        def tasks = observeTasks(p, repos.roots)
        def capture = { name ->
            def cfg = p.configurations.findByName(name)
            if (cfg == null) {
                return [:]
            }
            [(name): [
                root     : cfg.incoming.resolutionResult.rootComponent,
                artifacts: cfg.incoming.artifactView { lenient(false) }.artifacts.resolvedArtifacts,
            ]]
        }
        def classpaths = names.collectEntries(capture)
        def extras = extraNames.collectEntries(capture)
        def projects = [:]
        p.rootProject.allprojects { q ->
            projects[q.path] = [group: String.valueOf(q.group), name: q.name, version: String.valueOf(q.version)]
        }
        def out = new File(assayOut, 'project' + projectPath.replace(':', '_') + '.json')
        t.doLast {
            doc.other_runtime_classpaths = otherRuntime
            doc.uncollected = uncollected
            doc.aliases = aliases.unique()
            doc.tasks = tasks
            doc.foreign_roots = repos.roots
            doc.opaque_repositories = repos.opaque
            doc.projects = projects
            def id = { c ->
                if (c instanceof ModuleComponentIdentifier) {
                    return [group: c.group, name: c.module, version: c.version]
                }
                if (c instanceof ProjectComponentIdentifier) {
                    // Gradle 8.2 added buildPath and Gradle 9 removed name.
                    def build = c.build.hasProperty('buildPath') ? c.build.buildPath : c.build.name
                    return [project: c.projectPath, build: build]
                }
                return [other: c.displayName]
            }
            def walk = { cp ->
                def components = []
                def edges = []
                def unresolved = []
                def seen = [] as Set
                def queue = [cp.root.get()]
                while (!queue.isEmpty()) {
                    def c = queue.remove(0)
                    def key = c.id.displayName
                    if (!seen.add(key)) {
                        continue
                    }
                    components << [key: key, id: id(c.id)]
                    c.dependencies.each { d ->
                        if (d instanceof ResolvedDependencyResult) {
                            edges << [from: key, to: d.selected.id.displayName]
                            queue << d.selected
                        } else if (d instanceof UnresolvedDependencyResult) {
                            unresolved << [requested: d.requested.displayName, failure: failureText(d.failure)]
                        }
                    }
                }
                def files = []
                if (unresolved.isEmpty()) {
                    cp.artifacts.get().each { a ->
                        // The published file name, not the cache's, carries the classifier.
                        def fileName = a.id.metaClass.respondsTo(a.id, 'getFileName') ? a.id.fileName : a.file.name
                        files << [component: a.id.componentIdentifier.displayName, file: a.file.absolutePath, name: fileName]
                    }
                }
                [components: components, edges: edges, unresolved: unresolved, files: files]
            }
            doc.classpaths = classpaths.collectEntries { name, cp -> [(name): walk(cp)] }
            doc.extra_classpaths = extras.collectEntries { name, cp ->
                try {
                    [(name): walk(cp)]
                } catch (Exception e) {
                    [(name): [failure: failureText(e)]]
                }
            }
            out.text = JsonOutput.toJson(doc)
        }
    }
}
