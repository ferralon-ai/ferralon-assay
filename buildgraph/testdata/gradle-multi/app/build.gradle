plugins {
    id 'java'
}

// A resolvable configuration off every classpath, the way a javaagent ships beside the app.
configurations {
    agent {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    agent 'org.slf4j:slf4j-api:2.0.16'
    implementation project(':lib')
    implementation 'org.apache.commons:commons-text:1.12.0'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    // commons-text pulls commons-lang3 3.14.0 at run time; the test classpath mediates higher.
    testImplementation 'org.apache.commons:commons-lang3:3.17.0'
    testImplementation 'junit:junit:4.13.2'
}
